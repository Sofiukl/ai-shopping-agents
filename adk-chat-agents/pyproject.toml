[project]
name = "adk-chat-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-adk>=0.10.0",
    "fastapi>=0.141.1",
    "google-adk[mcp]>=2.11.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
shop-agent-server = "adk_chat_agents.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_chat_agents"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
