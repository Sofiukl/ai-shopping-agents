[project]
name = "mcp-orders"
version = "0.1.0"
description = "MCP server for orders (thin client of fake-shop-api)"
readme = "README.md"
authors = [
    { name = "Sofikul Mallick", email = "sofikul.projects@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fake-shop-api",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
mcp-orders = "mcp_orders.server:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
fake-shop-api = { path = "../fake-shop-api", editable = true }
